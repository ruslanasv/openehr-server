# Docker's embedded DNS returns one A record per ehrbase replica.
# "resolve" re-reads them every 10s, so scaling up/down or restarted
# replicas (new IPs) are picked up without restarting nginx.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream ehrbase {
    zone ehrbase 64k;
    server ehrbase:8080 resolve;
    keepalive 16;
}

server {
    listen 80;
    client_max_body_size 50m;          # large OPT templates / compositions

    location / {
        proxy_pass http://ehrbase;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;

        # try another instance if one is down
        proxy_next_upstream error timeout http_502 http_503;

        add_header X-Upstream $upstream_addr always;
    }
}
