# slf4j-simple: keep SDK / HTTP client logging quiet, the generator prints its own progress
org.slf4j.simpleLogger.defaultLogLevel=warn
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss.SSS
# Harmless: SDK logs "Path ... is choice but PartySelf is missing OptionFor" for every composer/subject/facility
org.slf4j.simpleLogger.log.org.ehrbase.openehr.sdk.serialisation.dto.DtoToCompositionWalker=error
